<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка и заполнение кодов (Kinder) - Капсула</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Inter, system-ui, sans-serif; background: #f5f7fb; color: #1f2937; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { margin-bottom: 20px; color: #4f46e5; }
        .upload-box { border: 2px dashed #e5e7eb; padding: 30px; text-align: center; border-radius: 8px; cursor: pointer; background: white; margin-bottom: 20px; transition: all 0.2s; }
        .upload-box:hover { border-color: #4f46e5; background: #f0f0ff; }
        .upload-box input { display: none; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .btn { padding: 10px 20px; background: #10b981; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: none; }
        .btn:hover { background: #059669; }
        .btn.show { display: inline-block; }
        .stats { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .stat-card { background: white; padding: 15px 25px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); flex: 1; min-width: 150px; }
        .stat-number { font-size: 28px; font-weight: 700; color: #ef4444; }
        .stat-label { font-size: 13px; color: #6b7280; margin-top: 4px; }
        .series-group { background: white; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); overflow: hidden; }
        .series-header { padding: 15px 20px; background: #f9fafb; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
        .series-header:hover { background: #f0f0ff; }
        .series-header h3 { color: #4f46e5; font-size: 16px; margin: 0; }
        .series-header .badge { background: #ef4444; color: white; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .series-header .toggle-icon { font-size: 18px; color: #6b7280; transition: transform 0.2s; }
        .series-header.open .toggle-icon { transform: rotate(180deg); }
        .series-body { padding: 10px 20px 20px; display: none; }
        .series-body.open { display: block; }
        .category-title { font-size: 14px; font-weight: 600; color: #4f46e5; margin: 15px 0 8px; }
        
        .item-row { padding: 12px; border-bottom: 1px solid #f3f4f6; display: flex; align-items: flex-start; gap: 15px; font-size: 14px; }
        .item-row:last-child { border-bottom: none; }
        
        .item-preview { width: 80px; height: 80px; object-fit: contain; border-radius: 6px; border: 1px solid #e5e7eb; background: #f9fafb; flex-shrink: 0; }
        
        .item-info { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .item-name { font-weight: 600; color: #1f2937; }
        .item-id { font-family: monospace; font-size: 11px; color: #9ca3af; }
        .item-path { font-size: 11px; color: #6b7280; background: #f3f4f6; padding: 2px 6px; border-radius: 4px; display: inline-block; word-break: break-all; margin-top: 4px; }
        
        .item-input-wrap { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
        .item-input-wrap label { font-size: 12px; font-weight: 600; color: #4f46e5; }
        .code-input { padding: 6px 10px; border: 2px solid #e5e7eb; border-radius: 6px; font-size: 13px; font-family: monospace; width: 150px; }
        .code-input:focus { outline: none; border-color: #4f46e5; }
        .code-input.saved { border-color: #10b981; background: #f0fdf4; }
        
        .empty-message { text-align: center; padding: 40px; color: #6b7280; font-size: 16px; }
        .no-issues { text-align: center; padding: 40px; color: #10b981; font-size: 18px; font-weight: 600; }
    </style>
</head>
<body>
<div class="container">
    <h1>🔍 Проверка кодов Kinder</h1>

    <div class="upload-box" onclick="document.getElementById('fileInput').click()">
        <input type="file" id="fileInput" webkitdirectory directory>
        <p>📁 Нажмите для выбора папки <code>data</code></p>
    </div>

    <div class="top-bar">
        <div id="statsContainer" class="stats" style="display:none; margin-bottom:0;">
            <div class="stat-card">
                <div class="stat-number" id="statSeries">0</div>
                <div class="stat-label">Серий с пустыми кодами</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="statItems">0</div>
                <div class="stat-label">Всего без кода</div>
            </div>
        </div>
        <button class="btn" id="downloadBtn" onclick="downloadModified()">💾 Скачать обновлённые JSON</button>
    </div>

    <div id="results"></div>
    <div id="emptyState" class="empty-message" style="display:none;">Загрузите папку data</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
    const categoryNames = {
        figures: '📦 Фигурки',
        extras: '🎁 Допы',
        variants: '🎲 Варианты',
        inserts: '📄 Вкладыши'
        // 'other' удален
    };

    let modifiedSeries = {};
    let loadedSeriesObjects = {};
    let loadedIndexData = [];

    document.getElementById('fileInput').addEventListener('change', async function(e) {
        const files = Array.from(e.target.files);
        if (!files.length) return;

        const jsonFiles = files.filter(f => f.name.endsWith('.json'));
        const indexFile = jsonFiles.find(f => f.name === 'index.json');
        
        if (!indexFile) {
            alert('Не найден index.json в выбранной папке');
            return;
        }

        let indexData;
        try {
            indexData = JSON.parse(await indexFile.text());
        } catch (err) {
            alert('Ошибка чтения index.json: ' + err.message);
            return;
        }

        if (!Array.isArray(indexData)) {
            alert('index.json не является массивом');
            return;
        }

        loadedIndexData = indexData;
        modifiedSeries = {};
        loadedSeriesObjects = {};
        let totalItems = 0;
        const results = [];

        for (const seriesInfo of indexData) {
            if (!seriesInfo || !seriesInfo.id) continue;
            // Фильтр только Киндер
            if (seriesInfo.manufacturer !== 'kinder') continue;

            const seriesFile = jsonFiles.find(f => f.name === `${seriesInfo.id}.json`);
            if (!seriesFile) continue;

            let series;
            try {
                series = JSON.parse(await seriesFile.text());
            } catch (err) {
                continue;
            }

            loadedSeriesObjects[seriesInfo.id] = series;

            const issues = [];
            // Убрали 'other' из списка проверяемых категорий
            const cats = ['figures', 'extras', 'variants', 'inserts'];
            
            cats.forEach(cat => {
                if (!Array.isArray(series[cat])) return;
                
                series[cat].forEach((item, idx) => {
                    const code = (item.code || '').trim();
                    if (!code) {
                        issues.push({
                            type: cat,
                            index: idx + 1,
                            item: item
                        });
                        totalItems++;
                    }
                });
            });

            if (issues.length > 0) {
                results.push({
                    seriesId: seriesInfo.id,
                    series: series,
                    issues: issues
                });
            }
        }

        document.getElementById('statsContainer').style.display = 'flex';
        document.getElementById('statSeries').textContent = results.length;
        document.getElementById('statItems').textContent = totalItems;
        
        renderResults(results);
    });

    function renderResults(results) {
        const resultsEl = document.getElementById('results');
        const emptyEl = document.getElementById('emptyState');
        const downloadBtn = document.getElementById('downloadBtn');
        
        resultsEl.innerHTML = '';
        downloadBtn.classList.remove('show');

        if (results.length === 0) {
            emptyEl.style.display = 'block';
            emptyEl.innerHTML = '<div class="no-issues">✅ Все коды у Kinder заполнены! Проблем не найдено.</div>';
            return;
        }

        emptyEl.style.display = 'none';

        results.forEach((res) => {
            const group = document.createElement('div');
            group.className = 'series-group';

            const byCat = {};
            res.issues.forEach(iss => {
                if (!byCat[iss.type]) byCat[iss.type] = [];
                byCat[iss.type].push(iss);
            });

            let bodyHtml = '';
            Object.keys(byCat).forEach(cat => {
                bodyHtml += `<div class="category-title">${categoryNames[cat] || cat} (${byCat[cat].length})</div>`;
                byCat[cat].forEach(iss => {
                    const item = iss.item;
                    const name = item.name || item.name_en || '(без названия)';
                    const imagePath = item.image || '';
                    
                    const imageHtml = imagePath 
                        ? `<img class="item-preview" src="${escapeAttr(imagePath)}" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'80\\' height=\\'80\\'><rect width=\\'80\\' height=\\'80\\' fill=\\'%23f3f4f6\\'/><text x=\\'50%\\' y=\\'50%\\' dominant-baseline=\\'middle\\' text-anchor=\\'middle\\' font-size=\\'24\\'>🖼️</text></svg>'">`
                        : `<div class="item-preview" style="display:flex;align-items:center;justify-content:center;color:#9ca3af;font-size:24px;">🖼️</div>`;

                    bodyHtml += `
                        <div class="item-row">
                            ${imageHtml}
                            <div class="item-info">
                                <div class="item-name">#${iss.index} · ${escapeHtml(name)}</div>
                                <div class="item-id">ID: ${escapeHtml(item.id || '')}</div>
                                <div class="item-path">📂 ${escapeHtml(imagePath || 'Путь не указан')}</div>
                                
                                <div class="item-input-wrap">
                                    <label>Код:</label>
                                    <input type="text" class="code-input" 
                                           data-series-id="${escapeAttr(res.seriesId)}" 
                                           data-cat="${cat}" 
                                           data-idx="${iss.index - 1}"
                                           placeholder="Введите код..."
                                           value="${escapeAttr(item.code || '')}"
                                           oninput="handleCodeInput(this)">
                                </div>
                            </div>
                        </div>
                    `;
                });
            });

            group.innerHTML = `
                <div class="series-header" onclick="toggleGroup(this)">
                    <div>
                        <h3>${escapeHtml(res.series.name || res.series.id)} (${res.series.year || ''})</h3>
                        <div style="font-size:12px;color:#6b7280;margin-top:4px;">ID: ${escapeHtml(res.series.id)}</div>
                    </div>
                    <div style="display:flex;align-items:center;gap:10px;">
                        <span class="badge">${res.issues.length} без кода</span>
                        <span class="toggle-icon">▼</span>
                    </div>
                </div>
                <div class="series-body">${bodyHtml}</div>
            `;

            resultsEl.appendChild(group);
        });
    }

    function toggleGroup(header) {
        header.classList.toggle('open');
        const body = header.nextElementSibling;
        if (body) body.classList.toggle('open');
    }

    window.handleCodeInput = function(input) {
        const seriesId = input.dataset.seriesId;
        const cat = input.dataset.cat;
        const idx = parseInt(input.dataset.idx);
        const newCode = input.value.trim();

        if (!loadedSeriesObjects[seriesId]) return;

        if (!modifiedSeries[seriesId]) {
            modifiedSeries[seriesId] = loadedSeriesObjects[seriesId];
        }

        const series = modifiedSeries[seriesId];
        if (series[cat] && series[cat][idx]) {
            series[cat][idx].code = newCode;
            
            if (newCode) {
                input.classList.add('saved');
                document.getElementById('downloadBtn').classList.add('show');
            } else {
                input.classList.remove('saved');
            }
        }
    };

    function downloadModified() {
        if (Object.keys(modifiedSeries).length === 0) {
            alert('Нет изменений для сохранения');
            return;
        }

        if (typeof JSZip === 'undefined') {
            alert('Библиотека JSZip не загружена. Проверьте интернет.');
            return;
        }

        const zip = new JSZip();
        const folder = zip.folder('series');

        Object.keys(modifiedSeries).forEach(seriesId => {
            const seriesData = modifiedSeries[seriesId];
            const manufacturer = seriesData.manufacturer || 'kinder';
            const manufFolder = folder.folder(manufacturer);
            
            manufFolder.file(`${seriesId}.json`, JSON.stringify(seriesData, null, 2));
        });

        zip.generateAsync({ type: 'blob' }).then(blob => {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `fixed_kinder_codes_${Date.now()}.zip`;
            a.click();
            URL.revokeObjectURL(blob);
        });
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>"']/g, m => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[m]));
    }

    function escapeAttr(str) {
        return escapeHtml(str);
    }
</script>
</body>
</html>
