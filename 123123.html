<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Редактор серий</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f3f4f6; margin: 0; padding: 16px; color: #1f2937; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  header { background: #fff; padding: 14px 18px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; border: 1px solid #e5e7eb; }
  .btn { position: relative; overflow: hidden; background: #2563eb; color: #fff; padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .save { background: #16a34a; color: #fff; border: none; padding: 7px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; }
  .save:disabled { background: #9ca3af; cursor: not-allowed; }
  .card { background: #fff; border-radius: 8px; margin-bottom: 16px; border: 1px solid #e5e7eb; overflow: hidden; }
  .head { background: #f9fafb; padding: 10px 14px; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; }
  .row { display: grid; grid-template-columns: 68px 130px 1fr 1fr; gap: 10px; align-items: center; padding: 8px 14px; border-bottom: 1px solid #e5e7eb; }
  .thumb { width: 64px; height: 64px; border: 1px solid #e5e7eb; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #9ca3af; overflow: hidden; }
  .thumb img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .en-box { display: flex; gap: 4px; }
  input.txt { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 5px; }
  input.miss { border-color: #ef4444; background: #fef2f2; }
  input.load { border-color: #3b82f6; background: #eff6ff; }
  .tr-btn { background: #e5e7eb; border: none; border-radius: 5px; padding: 0 9px; cursor: pointer; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <b>Редактор названий (manspo.github.io)</b>
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <label><input type="checkbox" id="tr" checked> Автоперевод EN</label>
      <label><input type="checkbox" id="ins"> Вкладыши</label>
      <div class="btn">📂 Открыть manspo.github.io<input type="file" id="dIn" webkitdirectory directory multiple></div>
    </div>
  </header>
  <div id="st" style="margin-bottom:12px;font-size:14px"></div>
  <div id="app"></div>
</div>
<script>
const $ = id => document.getElementById(id);
let list = [], imgs = new Map();
const DEF = /^(фигурка|доп|экстра|вариант|вкладыш|игрушка|предмет|figure|extra|variant|insert|toy|item)\s*№?\s*\d*$/i;
const miss = v => !v || !String(v).trim() || DEF.test(String(v).trim());

// Чистый латинский хост через ASCII-коды (защита от подмены символов при копировании)
const G_HOST = String.fromCharCode(116,114,97,110,115,108,97,116,101,46,103,111,111,103,108,101,97,112,105,115,46,99,111,109);

async function translateText(text) {
  try {
    const url = 'https://' + G_HOST + '/translate_a/single?client=gtx&sl=ru&tl=en&dt=t&q=' + encodeURIComponent(text);
    const r = await fetch(url);
    const d = await r.json();
    const res = d.at(0).map(x => x.at(0)).join('');
    return { ok: true, text: res.charAt(0).toUpperCase() + res.slice(1) };
  } catch (err) {
    return { ok: false, err: err.message };
  }
}

$('ins').onchange = () => list.length && render();

$('dIn').onchange = async e => {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  $('st').innerHTML = 'Загрузка...';
  list = []; imgs.clear();
  let idx = null, jsons = [];

  for (const f of files) {
    const p = f.webkitRelativePath.replace(/\\/g, '/');
    const iPos = p.indexOf('images/');
    if (iPos !== -1 && /\.(webp|png|jpe?g|gif|svg)$/i.test(p)) imgs.set(p.slice(iPos), f);
    else if (p.endsWith('data/index.json') || p.endsWith('/index.json')) idx = f;
    else if (p.includes('series/') && p.endsWith('.json')) jsons.push({ f, p });
  }

  const ord = new Map();
  if (idx) try { JSON.parse(await idx.text()).forEach((x, i) => ord.set(x.id, i)); } catch {}
  for (const j of jsons) {
    try {
      const data = JSON.parse(await j.f.text());
      list.push({ name: j.p.split('/').pop(), path: j.p, data, ord: ord.get(data.id) ?? 999999 });
    } catch {}
  }
  list.sort((a, b) => a.ord - b.ord);
  render();
};

function render() {
  const app = $('app'); app.innerHTML = '';
  const cats = [{k:'figures',t:'Фигурка'},{k:'extras',t:'Доп'},{k:'variants',t:'Вариант'},{k:'other',t:'Другое'}];
  if ($('ins').checked) cats.push({k:'inserts',t:'Вкладыш'});
  let bs = 0, bi = 0;

  for (const s of list) {
    const bad = [];
    for (const c of cats) {
      const arr = Reflect.get(s.data, c.k);
      if (Array.isArray(arr)) arr.forEach(it => {
        const mr = miss(it.name), me = miss(it.name_en);
        if (mr || me) bad.push({ t: c.t, it, mr, me });
      });
    }
    if (!bad.length) continue;
    bs++; bi += bad.length;

    const card = document.createElement('div'); card.className = 'card';
    const head = document.createElement('div'); head.className = 'head';
    head.innerHTML = `<div><b>${s.data.name || s.data.id}</b> (${s.data.year || '?'})<br><small>${s.path}</small></div>`;
    const btn = document.createElement('button'); btn.className = 'save'; btn.textContent = '💾 Скачать'; btn.disabled = true;
    btn.onclick = () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(s.data, null, 2)], { type: 'application/json' }));
      a.download = s.name; a.click(); btn.disabled = true;
    };
    head.append(btn); card.append(head);

    for (const r of bad) {
      const row = document.createElement('div'); row.className = 'row';
      const th = document.createElement('div'); th.className = 'thumb';
      const f = r.it.image && imgs.get(r.it.image.replace(/^\/+/, ''));
      th.innerHTML = f ? `<img src="${URL.createObjectURL(f)}">` : 'Нет фото';

      const inf = document.createElement('div');
      inf.innerHTML = `<b>${r.t}</b><br><small>Код: ${r.it.code || '—'}</small>`;

      const iRu = document.createElement('input'); iRu.type = 'text'; iRu.className = 'txt'; iRu.value = r.it.name || ''; iRu.placeholder = 'RU';
      if (r.mr) iRu.classList.add('miss');

      const enBox = document.createElement('div'); enBox.className = 'en-box';
      const iEn = document.createElement('input'); iEn.type = 'text'; iEn.className = 'txt'; iEn.value = r.it.name_en || ''; iEn.placeholder = 'EN';
      if (r.me) iEn.classList.add('miss');
      const reBtn = document.createElement('button'); reBtn.className = 'tr-btn'; reBtn.type = 'button'; reBtn.textContent = '🔄';
      enBox.append(iEn, reBtn);

      let enManual = !r.me, tm = null;

      const doTranslate = async (force = false) => {
        const val = iRu.value.trim();
        if (!val) return;
        if (!force && (!$('tr').checked || enManual || miss(val))) return;

        reBtn.textContent = '⏳';
        iEn.classList.add('load');
        const res = await translateText(val);
        reBtn.textContent = '🔄';
        iEn.classList.remove('load');

        if (res.ok) {
          iEn.value = r.it.name_en = res.text;
          iEn.classList.toggle('miss', miss(res.text));
          btn.disabled = false;
        } else {
          iEn.placeholder = 'Ошибка: ' + res.err;
        }
      };

      reBtn.onclick = () => { enManual = false; doTranslate(true); };

      iRu.oninput = () => {
        r.it.name = iRu.value;
        iRu.classList.toggle('miss', miss(iRu.value));
        btn.disabled = false;
        clearTimeout(tm);
        tm = setTimeout(() => doTranslate(false), 600);
      };
      iRu.onblur = () => { clearTimeout(tm); doTranslate(false); };

      iEn.oninput = () => {
        enManual = !miss(iEn.value);
        r.it.name_en = iEn.value;
        iEn.classList.toggle('miss', miss(iEn.value));
        btn.disabled = false;
      };

      row.append(th, inf, iRu, enBox); card.append(row);
    }
    app.append(card);
  }
  $('st').innerHTML = `Серий: <b>${list.length}</b> | С пропусками: <b>${bs}</b> | Позиций: <b>${bi}</b> | Фото: <b>${imgs.size}</b>`;
}
</script>
</body>
</html>
