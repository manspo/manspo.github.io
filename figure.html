<!DOCTYPE html>
<html lang="ru">
<head>
  <script src="js/qrcode.min.js"></script>
  <meta charset="UTF-8" />
  <script>
  (function() {
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
  })();
  </script>
  <title>Фигурка — Капсула</title>
  <link rel="stylesheet" href="css/style.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Капсула">
  <link rel="apple-touch-icon" href="images/icon-192x192.webp">
  <style>
    /* Дополнительные стили для страницы фигурки */
    .figure-container {
      max-width: 900px;
      margin: 0 auto;
    }
    .figure-header {
      display: flex;
      gap: 40px;
      align-items: flex-start;
    }
    .figure-image-wrapper {
      flex-shrink: 0;
      position: relative;
    }
    .figure-image {
      width: 280px;
      height: 280px;
      object-fit: contain;
      background: linear-gradient(135deg, #f5f7fb 0%, #eef2f6 100%);
      border-radius: 20px;
      padding: 20px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .figure-image:hover {
      transform: scale(1.02);
    }
    .figure-type-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: var(--primary);
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .figure-info {
      flex: 1;
    }
    .figure-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 20px;
      line-height: 1.3;
    }
    .figure-meta {
      background: var(--bg);
      border-radius: 16px;
      padding: 16px 20px;
      margin-bottom: 20px;
    }
    .figure-meta-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }
    .figure-meta-item:last-child {
      border-bottom: none;
    }
    .meta-icon {
      font-size: 18px;
      width: 28px;
    }
    .meta-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }
    .meta-link:hover {
      text-decoration: underline;
    }
    .meta-year {
      color: var(--muted);
      font-size: 13px;
    }
    .figure-code-value {
      font-family: monospace;
      background: var(--card);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 13px;
    }
    .figure-condition {
      background: #fef3c7;
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    [data-theme="dark"] .figure-condition {
      background: #451a03;
    }
    .condition-icon {
      font-size: 18px;
    }
    .condition-text {
      flex: 1;
      font-size: 14px;
      color: #92400e;
    }
    [data-theme="dark"] .condition-text {
      color: #fde68a;
    }
    .figure-actions {
      display: flex;
      gap: 15px;
      justify-content: flex-end;
      margin-top: 10px;
    }
    .figure-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border: none;
      border-radius: 40px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }
    .figure-btn-buy {
      background: var(--warning);
      color: white;
    }
    .figure-btn-buy:hover {
      transform: translateY(-2px);
      background: #fbbf24;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
    }
    .figure-btn-qr {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .figure-btn-qr:hover {
      background: var(--primary);
      color: white;
      transform: translateY(-2px);
      border-color: var(--primary);
    }
    @media (max-width: 768px) {
      .figure-header {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .figure-image {
        width: 220px;
        height: 220px;
      }
      .figure-title {
        font-size: 22px;
        text-align: center;
      }
      .figure-actions {
        justify-content: center;
      }
      .figure-meta-item {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
<header class="header">
  <div class="header-left">
    <a href="index.html" class="brand">
      <img src="images/logo.webp" class="logo-img" alt="Logo">
      <span class="logo" data-i18n="site_name">Капсула</span>
    </a>
  </div>
  <div class="header-tagline">
    <span class="tagline-main" data-i18n="home_title">Каталог коллекций игрушек</span>
    <span class="tagline-sub" data-i18n="home_sub">Kinder, Nestle, Landrin и другие производители</span>
  </div>
</header>

<main class="figure-page">
  <button class="back-button" onclick="history.back()">
    <span class="back-arrow">←</span> <span data-i18n="back">Назад</span>
  </button>
  <div id="figureContainer"></div>
  
  <!-- Lightbox -->
  <div id="lightbox" class="lightbox" onclick="closeLightbox()">
    <span class="lightbox-prev" onclick="event.stopPropagation(); prevLightboxImage()">&#10094;</span>
    <span class="lightbox-next" onclick="event.stopPropagation(); nextLightboxImage()">&#10095;</span>
    <div class="lightbox-zoom-container">
      <img id="lightboxImg" class="lightbox-content">
    </div>
    <div id="imageCounter" class="lightbox-counter"></div>
    <div class="lightbox-zoom-controls">
      <button class="zoom-btn" id="zoomInBtn" title="Увеличить">➕</button>
      <button class="zoom-btn" id="zoomOutBtn" title="Уменьшить">➖</button>
      <button class="zoom-btn" id="zoomResetBtn" title="Сбросить">⟳</button>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="footer-controls">
    <div class="lang-switch-footer">
      <img src="images/flags/ru.png" data-lang="ru" class="flag" onclick="setLang('ru')" style="cursor: pointer;">
      <img src="images/flags/en.png" data-lang="en" class="flag" onclick="setLang('en')" style="cursor: pointer;">
    </div>
    <div class="theme-switch">🌙</div>
  </div>
  <div class="support-buttons">
    <a href="https://dalink.to/mansurdm" class="support-btn" data-i18n="support_project">Поддержать проект</a>
  </div>
  <div class="copyright" data-i18n="footer_copyright">© 2026 Капсула</div>
</footer>

<script src="js/script.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .then(reg => console.log('✅ SW registered:', reg))
      .catch(err => console.log('❌ SW error:', err));
  });
}
</script>
<!-- В каждый HTML после регистрации SW -->
<script>
// Проверка обновлений SW
let refreshing = false;
navigator.serviceWorker.addEventListener('controllerchange', () => {
  if (!refreshing) {
    refreshing = true;
    window.location.reload();
  }
});
</script>
</body>
</html>
