<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Редактор названий серий</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f3f4f6; color: #1f2937; margin: 0; padding: 20px; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  header { background: #fff; padding: 16px 20px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; gap: 15px; margin-bottom: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  h1 { margin: 0; font-size: 18px; }
  .controls { display: flex; gap: 12px; align-items: center; }
  .btn { background: #2563eb; color: #fff; padding: 9px 16px; border-radius: 7px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; }
  .btn:hover { background: #1d4ed8; }
  .btn-save { background: #16a34a; }
  .btn-save:hover:not(:disabled) { background: #15803d; }
  .btn:disabled { background: #9ca3af; cursor: not-allowed; }
  .stats { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; padding: 10px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; display: none; }
  .card { background: #fff; border-radius: 10px; margin-bottom: 20px; border: 1px solid #e5e7eb; overflow: hidden; }
  .card-head { background: #f9fafb; padding: 12px 18px; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .card-title { font-weight: 700; font-size: 16px; }
  .card-meta { font-size: 12px; color: #6b7280; margin-top: 3px; }
  .row { display: grid; grid-template-columns: 74px 160px 1fr 1fr; gap: 12px; align-items: center; padding: 10px 18px; border-bottom: 1px solid #e5e7eb; }
  .row:last-child { border-bottom: none; }
  .thumb { width: 68px; height: 68px; border: 1px solid #e5e7eb; border-radius: 6px; display: flex; align-items: center; justify-content: center; background: #f9fafb; overflow: hidden; font-size: 11px; color: #9ca3af; }
  .thumb img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .tag { display: inline-block; background: #e5e7eb; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .code { font-size: 12px; color: #6b7280; font-family: monospace; margin-top: 3px; }
  .field { display: flex; flex-direction: column; gap: 3px; }
  .field label { font-size: 11px; font-weight: 600; color: #6b7280; }
  .field input { width: 100%; box-sizing: border-box; padding: 7px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
  .field input.miss { border-color: #f87171; background: #fef2f2; }
  .badge { font-size: 12px; padding: 3px 8px; border-radius: 5px; font-weight: 600; display: none; }
  .dirty { background: #fef3c7; color: #92400e; display: inline-block; }
  .saved { background: #dcfce7; color: #166534; display: inline-block; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Проверка и заполнение названий</h1>
      <div style="font-size:12px;color:#6b7280;margin-top:3px">Выберите папку с проектом (где лежат <code>data</code> и <code>images</code>) или папку <code>data</code></div>
    </div>
    <div class="controls">
      <label style="font-size:13px;cursor:pointer"><input type="checkbox" id="chkIns"> Проверять вкладыши</label>
      <label class="btn">📂 Выбрать папку<input type="file" id="dirIn" webkitdirectory directory multiple hidden></label>
    </div>
  </header>
  <div id="stats" class="stats"></div>
  <div id="app"></div>
</div>

<script>
const dirIn = document.getElementById('dirIn');
const chkIns = document.getElementById('chkIns');
const stats = document.getElementById('stats');
const app = document.getElementById('app');

let seriesList = [];
let imgMap = new Map();
const DEF_RE = /^(фигурка|доп|экстра|вариант|вкладыш|игрушка|предмет|figure|extra|variant|insert|toy|item)\s*№?\s*\d*$/i;

const isMiss = v => !v || typeof v !== 'string' || !v.trim() || DEF_RE.test(v.trim());

chkIns.onchange = () => seriesList.length && render();

dirIn.onchange = async e => {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  app.innerHTML = 'Загрузка...';
  stats.style.display = 'none';
  seriesList = [];
  imgMap.clear();

  let idxFile = null;
  const sFiles = [];

  for (const f of files) {
    const p = f.webkitRelativePath.replace(/\\/g, '/');
    const iPos = p.indexOf('images/');
    if (iPos !== -1 && f.type.startsWith('image/')) imgMap.set(p.slice(iPos), f);
    if (p.endsWith('data/index.json') || p === 'index.json') idxFile = f;
    if (p.includes('series/') && p.endsWith('.json')) sFiles.push({ f, p });
  }

  if (!sFiles.length) {
    app.innerHTML = '';
    return alert('Не найдены JSON-файлы в папке series');
  }

  const order = new Map();
  if (idxFile) {
    try {
      const arr = JSON.parse(await idxFile.text());
      if (Array.isArray(arr)) arr.forEach((x, i) => order.set(x.id, i));
    } catch {}
  }

  for (const item of sFiles) {
    try {
      const data = JSON.parse(await item.f.text());
      seriesList.push({
        name: item.p.split('/').pop(),
        path: item.p,
        data,
        ord: order.has(data.id) ? order.get(data.id) : 999999
      });
    } catch {}
  }

  seriesList.sort((a, b) => a.ord - b.ord);
  render();
};

function render() {
  app.innerHTML = '';
  const cats = [
    { k: 'figures', t: 'Фигурка' },
    { k: 'extras', t: 'Доп' },
    { k: 'variants', t: 'Вариант' },
    { k: 'other', t: 'Другое' }
  ];
  if (chkIns.checked) cats.push({ k: 'inserts', t: 'Вкладыш' });

  let badSeries = 0, badTotal = 0;

  for (const s of seriesList) {
    const items = [];
    for (const c of cats) {
      if (!Array.isArray(s.data[c.k])) continue;
      for (const it of s.data[c.k]) {
        const mRu = isMiss(it.name), mEn = isMiss(it.name_en);
        if (mRu || mEn) items.push({ t: c.t, it, mRu, mEn });
      }
    }
    if (!items.length) continue;

    badSeries++;
    badTotal += items.length;

    const card = document.createElement('div');
    card.className = 'card';

    const head = document.createElement('div');
    head.className = 'card-head';
    head.innerHTML = `<div><div class="card-title">${s.data.name || s.data.id} (${s.data.year || '?'})</div><div class="card-meta">${s.path} • Пропусков: <b>${items.length}</b></div></div>`;

    const act = document.createElement('div');
    act.style.cssText = 'display:flex;align-items:center;gap:8px';
    const badge = document.createElement('span');
    badge.className = 'badge';
    const btn = document.createElement('button');
    btn.className = 'btn btn-save';
    btn.textContent = '💾 Скачать JSON';
    btn.disabled = true;

    btn.onclick = () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(s.data, null, 2)], { type: 'application/json' }));
      a.download = s.name;
      a.click();
      btn.disabled = true;
      badge.className = 'badge saved';
      badge.textContent = 'Скачано';
    };

    act.append(badge, btn);
    head.append(act);
    card.append(head);

    for (const rowData of items) {
      const row = document.createElement('div');
      row.className = 'row';

      const thumb = document.createElement('div');
      thumb.className = 'thumb';
      const imgF = rowData.it.image && imgMap.get(rowData.it.image);
      if (imgF) {
        const img = document.createElement('img');
        img.src = URL.createObjectURL(imgF);
        thumb.append(img);
      } else {
        thumb.textContent = 'Нет фото';
      }

      const info = document.createElement('div');
      info.innerHTML = `<span class="tag">${rowData.t}</span><div class="code">Код: ${rowData.it.code || '—'}</div>`;

      const mkField = (lbl, key, isM) => {
        const box = document.createElement('div');
        box.className = 'field';
        box.innerHTML = `<label>${lbl}</label>`;
        const inp = document.createElement('input');
        inp.value = rowData.it[key] || '';
        if (isM) inp.classList.add('miss');
        inp.oninput = e => {
          rowData.it[key] = e.target.value;
          btn.disabled = false;
          badge.className = 'badge dirty';
          badge.textContent = 'Изменено';
          inp.classList.toggle('miss', isMiss(e.target.value));
        };
        box.append(inp);
        return box;
      };

      row.append(
        thumb,
        info,
        mkField('Название (RU)', 'name', rowData.mRu),
        mkField('Название (EN)', 'name_en', rowData.mEn)
      );
      card.append(row);
    }
    app.append(card);
  }

  stats.style.display = 'block';
  stats.innerHTML = badSeries
    ? `Серий проверено: <b>${seriesList.length}</b> | С пропусками: <b>${badSeries}</b> | Позиций: <b>${badTotal}</b>`
    : `✅ Проверено серий: <b>${seriesList.length}</b>. Пустых названий нет.`;
}
</script>
</body>
</html>
